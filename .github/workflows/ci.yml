name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Draft transitions launch a lightweight check; full packaging runs only once ready.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

# New commits supersede stale PR test, package and smoke jobs.
# Keep main-branch validation running and isolate this group from Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'

  # Type-checks and builds the popover that the Go binary embeds.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cmd/freetokens/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/freetokens/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Compiles the Wails popover on every platform that has one: Windows, which ships it, and Linux,
  # whose archives stay CGO-free but whose users build the popover from source (with the WebKit 4.1
  # tag current distributions ship) instead of it going untested until someone tries it. macOS has
  # no Wails build: its menu bar app is the SwiftUI one in FreeTokens.app, built by the package job.
  gui-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, tags: "gui production" }
          - { os: ubuntu-latest, tags: "gui production webkit2_41" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/freetokens/web/package-lock.json
      - name: Build embedded frontend
        working-directory: cmd/freetokens/web
        run: |
          npm ci
          npm run build
      - name: GTK and WebKit headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet -tags "${{ matrix.tags }}" ./cmd/freetokens
      - run: go build -tags "${{ matrix.tags }}" ./cmd/freetokens

  # Builds the real release archives (every target) without publishing them.
  package:
    # Drafts keep cross-platform unit tests, but defer costly archive and install checks.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/freetokens/web/package-lock.json
      # CI only packages the six platform archives exercised by install-smoke, rather than
      # building every supported Go port. Tagged releases still use the unmodified full
      # .goreleaser.yaml in release.yml.
      - name: Generate limited snapshot config from release config
        run: go run ./scripts/ci-goreleaser .goreleaser.yaml "$RUNNER_TEMP/freetokens-ci.yaml"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --config ${{ runner.temp }}/freetokens-ci.yaml
      - name: Add the macOS app zip
        run: cp dist-app/FreeTokens-*-macOS.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7

  # Installs an archive the way a user would and exercises every command without a Freebuff
  # account, using a fake Desktop history to check local usage tracking.
  install-smoke:
    needs: package
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux_amd64.tar.gz }
          - { os: ubuntu-24.04-arm, target: linux_arm64.tar.gz }
          - { os: windows-latest, target: windows_amd64.zip }
          - { os: windows-11-arm, target: windows_arm64.zip }
          - { os: macos-latest, target: darwin_arm64.tar.gz }
          - { os: macos-15-intel, target: darwin_amd64.tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Throwaway home with a fake Desktop history
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          go run scripts/mkfixture.go "$home"
          echo "HOME=$home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$(cygpath -w "$home" 2>/dev/null || echo "$home")" >> "$GITHUB_ENV"
      - name: Install and run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive=$(cd dist && ls freetokens_*_${{ matrix.target }})
          bash scripts/smoke.sh "$PWD/dist" "$archive"

  # Unpacks FreeTokens.app the way a user would, checks the signature and both architectures, runs
  # the bundled engine, and launches the app to render its panel offscreen.
  app-smoke:
    needs: package
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Throwaway home with a fake Desktop history
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          go run scripts/mkfixture.go "$home"
          echo "HOME=$home" >> "$GITHUB_ENV"
      - name: Install and run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(cd dist && ls FreeTokens-*-macOS.zip)
          scripts/smoke-app.sh "$PWD/dist" "$zip" "$RUNNER_TEMP/panel-${{ matrix.os }}.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-${{ matrix.os }}
          path: ${{ runner.temp }}/panel-*.png
          if-no-files-found: ignore
          retention-days: 7
